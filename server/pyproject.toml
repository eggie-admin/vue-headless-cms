[project]
name = "video-forge-control"
version = "0.6.0"
description = "Single Python control plane for Video Forge tablet, persistent Vue CMS, boss agents, feeds, compatibility routes and cloud sync"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi[standard]>=0.116",
  "flask>=3.1.3",
  "google-auth[requests]>=2.40",
  "httpx>=0.28",
  "openai-agents>=0.14.0",
  "pydantic>=2.11",
  "redis>=6.0"
]

[project.optional-dependencies]
analytics = [
  "mixpanel>=4.11.1"
]

[tool.fastapi]
entrypoint = "app.main:app"
