name: android-debug-apk

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'godot/**'
      - 'server/**'
      - 'fdroid/**'
      - 'release/**'
      - 'scripts/stage_fdroid_repo.py'
      - 'scripts/cathedral_full_sanity.py'
      - 'termux/install-local-apk.sh'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [video-forge-usb-cache]
    paths:
      - 'apps/**'
      - 'godot/**'
      - 'server/**'
      - 'fdroid/**'
      - 'release/**'
      - 'scripts/stage_fdroid_repo.py'
      - 'scripts/cathedral_full_sanity.py'
      - 'termux/install-local-apk.sh'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_RELEASE: 4.7.2-stable
      GODOT_TEMPLATE_VERSION: 4.7.2.stable
      GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      APK_PATH: build/android/video-forge-cathedral-debug.apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36'

      - name: Install verified Godot 4.7.2 editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot-4.7.2"
          mkdir -p "$GODOT_DIR"
          cd "$GODOT_DIR"

          curl --fail --location --retry 3 \
            -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  godot.zip" | sha256sum --check --strict
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$GODOT_DIR/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            -o export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  export_templates.tpz" | sha256sum --check --strict

          rm -rf templates-unpack
          mkdir templates-unpack
          unzip -q export_templates.tpz -d templates-unpack
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a templates-unpack/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_source.zip"

      - name: Build packaged Vue CMS
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          cd apps
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build --workspace=video-forge-ui
          test -f forge-ui/dist/index.html

      - name: Build Godot Android v2 WebView plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf godot/android-plugin/plugin/src/main/assets/cms
          mkdir -p godot/android-plugin/plugin/src/main/assets/cms
          cp -a apps/forge-ui/dist/. godot/android-plugin/plugin/src/main/assets/cms/
          gradle -p godot/android-plugin :plugin:assemble
          test -f godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar
          test -f godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar

          rm -rf godot/addons/CathedralAndroid
          mkdir -p godot/addons/CathedralAndroid/bin/debug godot/addons/CathedralAndroid/bin/release
          cp -a godot/android-plugin/plugin/export_scripts_template/. godot/addons/CathedralAndroid/
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-debug.aar \
            godot/addons/CathedralAndroid/bin/debug/CathedralAndroid-debug.aar
          cp godot/android-plugin/plugin/build/outputs/aar/CathedralAndroid-release.aar \
            godot/addons/CathedralAndroid/bin/release/CathedralAndroid-release.aar

      - name: Run full Cathedral architecture gate
        run: python scripts/cathedral_full_sanity.py

      - name: Configure Android export and ephemeral debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build/android
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          KEYSTORE_PATH="$RUNNER_TEMP/video-forge-debug.keystore"
          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Video Forge Debug,O=EggieBagelFace,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
          echo 'ephemeral-ci' | tee build/android/signing-mode.txt

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version
          "$GODOT_BIN" --headless --editor --path godot --quit

      - name: Install Gradle template and export signed Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          "$GODOT_BIN" --headless --path godot \
            --install-android-build-template \
            --export-debug 'Android Debug' \
            "$GITHUB_WORKSPACE/$APK_PATH"
          test -s "$APK_PATH"

      - name: Verify APK, release identity, WebView plugin, CMS assets and 16 KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH" | tee build/android/signature.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH" | tee build/android/zipalign.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK_PATH" | tee build/android/badging.txt
          "$BUILD_TOOLS/aapt" dump xmltree "$APK_PATH" AndroidManifest.xml | tee build/android/manifest.txt
          unzip -l "$APK_PATH" | tee build/android/contents.txt

          VERSION_NAME="$(python -c 'import json; print(json.load(open("release/version.json"))["version"])')"
          VERSION_CODE="$(python -c 'import json; print(json.load(open("release/version.json"))["versionCode"])')"
          PACKAGE_ID="$(python -c 'import json; print(json.load(open("release/version.json"))["packageId"])')"
          grep -q "package: name='$PACKAGE_ID'" build/android/badging.txt
          grep -q "versionCode='$VERSION_CODE'" build/android/badging.txt
          grep -q "versionName='$VERSION_NAME'" build/android/badging.txt
          grep -q 'lib/arm64-v8a/' build/android/contents.txt
          if grep -qE 'lib/(armeabi-v7a|x86|x86_64)/' build/android/contents.txt; then
            echo 'Unexpected non-arm64 native ABI found in APK' >&2
            exit 1
          fi
          grep -q 'assets/cms/index.html' build/android/contents.txt
          grep -q 'org.godotengine.plugin.v2.CathedralAndroid' build/android/manifest.txt
          sha256sum "$APK_PATH" | tee build/android/sha256.txt

      - name: Stage private F-Droid repo input
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(python -c 'import json; print(json.load(open("release/version.json"))["versionCode"])')"
          PACKAGE_ID="$(python -c 'import json; print(json.load(open("release/version.json"))["packageId"])')"
          python scripts/stage_fdroid_repo.py \
            --apk "$APK_PATH" \
            --output build/fdroid-stage \
            --package "$PACKAGE_ID" \
            --version-code "$VERSION_CODE"

      - name: Upload Android debug APK and private F-Droid staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: video-forge-cathedral-android-debug
          path: |
            build/android/video-forge-cathedral-debug.apk
            build/android/sha256.txt
            build/android/signature.txt
            build/android/zipalign.txt
            build/android/badging.txt
            build/android/manifest.txt
            build/android/signing-mode.txt
            build/fdroid-stage/**
          if-no-files-found: error
          retention-days: 14
