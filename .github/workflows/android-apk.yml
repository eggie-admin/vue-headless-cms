name: android-debug-apk

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'godot/**'
      - 'fdroid/**'
      - 'scripts/stage_fdroid_repo.py'
      - 'termux/install-local-apk.sh'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [video-forge-usb-cache]
    paths:
      - 'godot/**'
      - 'fdroid/**'
      - 'scripts/stage_fdroid_repo.py'
      - 'termux/install-local-apk.sh'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_RELEASE: 4.7.2-stable
      GODOT_TEMPLATE_VERSION: 4.7.2.stable
      GODOT_EDITOR_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      APK_PATH: build/android/video-forge-cathedral-debug.apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'platforms;android-36'

      - name: Install verified Godot 4.7.2 editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_DIR="$RUNNER_TEMP/godot-4.7.2"
          mkdir -p "$GODOT_DIR"
          cd "$GODOT_DIR"

          curl --fail --location --retry 3 \
            -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_EDITOR_SHA256}  godot.zip" | sha256sum --check --strict
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=$GODOT_DIR/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

          curl --fail --location --retry 3 \
            -o export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v4.7.2-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  export_templates.tpz" | sha256sum --check --strict

          rm -rf templates-unpack
          mkdir templates-unpack
          unzip -q export_templates.tpz -d templates-unpack
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a templates-unpack/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Configure Android export and signing
        shell: bash
        env:
          VIDEO_FORGE_ANDROID_KEYSTORE_B64: ${{ secrets.VIDEO_FORGE_ANDROID_KEYSTORE_B64 }}
          VIDEO_FORGE_ANDROID_KEYSTORE_ALIAS: ${{ secrets.VIDEO_FORGE_ANDROID_KEYSTORE_ALIAS }}
          VIDEO_FORGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VIDEO_FORGE_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build/android
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          KEYSTORE_PATH="$RUNNER_TEMP/video-forge-debug.keystore"
          if [[ -n "${VIDEO_FORGE_ANDROID_KEYSTORE_B64:-}" && -n "${VIDEO_FORGE_ANDROID_KEYSTORE_ALIAS:-}" && -n "${VIDEO_FORGE_ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            printf '%s' "$VIDEO_FORGE_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$VIDEO_FORGE_ANDROID_KEYSTORE_PASSWORD" -alias "$VIDEO_FORGE_ANDROID_KEYSTORE_ALIAS" >/dev/null
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$VIDEO_FORGE_ANDROID_KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$VIDEO_FORGE_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo 'stable-secret' | tee build/android/signing-mode.txt
          else
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Video Forge Debug,O=EggieBagelFace,C=US'
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
            echo 'ephemeral-ci' | tee build/android/signing-mode.txt
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version
          "$GODOT_BIN" --headless --editor --path godot --quit

      - name: Export signed Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          "$GODOT_BIN" --headless --path godot \
            --export-debug 'Android Debug' \
            "$GITHUB_WORKSPACE/$APK_PATH"
          test -s "$APK_PATH"

      - name: Verify APK signature, arm64 payload and 16 KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH" | tee build/android/signature.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH" | tee build/android/zipalign.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK_PATH" | tee build/android/badging.txt
          unzip -l "$APK_PATH" | tee build/android/contents.txt
          grep -q 'lib/arm64-v8a/' build/android/contents.txt
          if grep -qE 'lib/(armeabi-v7a|x86|x86_64)/' build/android/contents.txt; then
            echo 'Unexpected non-arm64 native ABI found in APK' >&2
            exit 1
          fi
          sha256sum "$APK_PATH" | tee build/android/sha256.txt

      - name: Stage private F-Droid repo input
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_fdroid_repo.py \
            --apk "$APK_PATH" \
            --output build/fdroid-stage \
            --package art.eggiebagelface.videoforge.dev \
            --version-code 4

      - name: Upload Android debug APK and private F-Droid staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: video-forge-cathedral-android-debug
          path: |
            build/android/video-forge-cathedral-debug.apk
            build/android/sha256.txt
            build/android/signature.txt
            build/android/zipalign.txt
            build/android/badging.txt
            build/android/signing-mode.txt
            build/fdroid-stage/**
          if-no-files-found: error
          retention-days: 14
