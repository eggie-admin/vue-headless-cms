name: forge-ci

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'server/**'
      - 'godot/**'
      - 'modal/**'
      - 'schemas/**'
      - 'manifests/**'
      - 'analytics/**'
      - 'fdroid/**'
      - 'termux/**'
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'
      - 'samsung-sm-x400/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/workflows/forge-ci.yml'
  push:
    branches: [video-forge-usb-cache]
    paths:
      - 'apps/**'
      - 'server/**'
      - 'godot/**'
      - 'modal/**'
      - 'schemas/**'
      - 'manifests/**'
      - 'analytics/**'
      - 'fdroid/**'
      - 'termux/**'
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'
      - 'samsung-sm-x400/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/workflows/forge-ci.yml'

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_LOCK_SHA256: 7929d5c53793563492ff0f5b39278904ecfa5508b10071d5b6d4b0b268fe653c

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Verify committed npm lock provenance
        run: echo "${NPM_LOCK_SHA256}  package-lock.json" | sha256sum --check --strict
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace=video-forge-ui
      - name: Smoke npm-orchestrated backend install and runtime
        run: npm run backend:install-smoke
      - name: Validate full Samsung SM-X400 constellation
        run: npm run samsung:full:check
      - name: Validate optional SM-X400 widget lane
        run: npm run widget:check
      - name: Validate optional Shizuku privilege broker
        run: npm run shizuku:check
      - name: Stage optional SM-X400 widget bundle
        run: npm run widget:build
      - name: Prove npm wizard keeps widget opt-in
        run: npm run wizard -- --candidate --with-widget --dry-run
      - name: Prove npm wizard keeps Shizuku opt-in
        run: npm run wizard -- --candidate --with-shizuku --dry-run

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./server
      - run: python -m compileall -q server/app scripts tests samsung-sm-x400/frontend/widget
      - run: python scripts/samsung_benchmark.py --validate-config
      - run: python scripts/sm_x400_full_samsung_sanity.py
      - run: python scripts/sm_x400_widget_build.py --check
      - run: python scripts/sm_x400_shizuku_sanity.py
      - run: python -m unittest discover -s tests -v
      - name: Smoke FastAPI runtime directly
        run: python scripts/backend_smoke.py

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m json.tool schemas/cutscene.schema.json >/dev/null
      - run: python -m json.tool schemas/agent-decision.schema.json >/dev/null
      - run: python -m json.tool schemas/telemetry-event.schema.json >/dev/null
      - run: python -m json.tool schemas/feed-item.schema.json >/dev/null
      - run: python -m json.tool schemas/feed-assessment.schema.json >/dev/null
      - run: python -m json.tool schemas/boss-ai-manifest.schema.json >/dev/null
      - run: python -m json.tool manifests/boss-ai.manifest.json >/dev/null
      - run: python -m json.tool manifests/cloud-ai.manifest.json >/dev/null
      - run: python -m json.tool analytics/event-catalog.json >/dev/null
      - run: python -m json.tool infra/edge/edge-security.manifest.json >/dev/null
      - run: python -m json.tool infra/samsung/samsung-lite-profile.json >/dev/null
      - run: python -m json.tool samsung-sm-x400/samsung-dev-stack.manifest.json >/dev/null
      - run: python -m json.tool samsung-sm-x400/frontend/widget/widget.manifest.json >/dev/null
      - run: python -m json.tool samsung-sm-x400/frontend/widget/shizuku/shizuku.manifest.json >/dev/null
      - run: |
          python - <<'PY'
          import tomllib
          with open('server/pyproject.toml', 'rb') as f:
              tomllib.load(f)
          print('pyproject.toml ok')
          PY
      - run: python scripts/architecture_sanity.py
      - run: python scripts/build_boss_manifest.py --check
      - run: python scripts/boss_ai_sanity.py
      - run: python scripts/cathedral_full_sanity.py
      - run: python scripts/edge_security_sanity.py
      - run: python scripts/cloud_provider_sanity.py
      - run: python scripts/samsung_edge_sanity.py
      - run: python scripts/sm_x400_full_samsung_sanity.py
      - run: python scripts/sm_x400_widget_build.py --check
      - run: python scripts/sm_x400_shizuku_sanity.py
