name: KAI 9000 Promote Proven CI Lock

on:
  push:
    branches:
      - samsung-sm-x400-build-candidate
    paths:
      - '.github/workflows/kai9000-promote-ci-lock.yml'

permissions:
  contents: write

concurrency:
  group: kai9000-promote-ci-lock
  cancel-in-progress: false

jobs:
  promote-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout donor branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: samsung-sm-x400-build-candidate
          persist-credentials: true

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'

      - name: Generate and verify exact CI lock
        working-directory: apps
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2 --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo '7929d5c53793563492ff0f5b39278904ecfa5508b10071d5b6d4b0b268fe653c  package-lock.json' | sha256sum --check --strict

      - name: Commit only the verified lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KAI 9000 Forge'
          git config user.email '280515000+eggie-admin@users.noreply.github.com'
          git add -- apps/package-lock.json
          if git diff --cached --quiet; then
            echo 'LOCK_ALREADY_PROMOTED'
            exit 0
          fi
          git commit -m 'Pin Vue cockpit npm dependency lock'
          git push origin HEAD:samsung-sm-x400-build-candidate
          echo 'LOCK_PROMOTED_GREEN'
