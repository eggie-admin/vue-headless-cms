name: python3-apk-template

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Optional git ref to build instead of the triggering ref
        required: false
        default: ''
  workflow_call:
    inputs:
      checkout_ref:
        description: Optional git ref to build instead of the caller ref
        required: false
        type: string
        default: ''
  push:
    branches:
      - samsung-sm-x400-backend
      - samsung-sm-x400-build-candidate
    paths:
      - 'templates/python3-apk/**'
      - '.github/workflows/python3-apk-template.yml'
  pull_request:
    branches: [samsung-sm-x400]
    paths:
      - 'templates/python3-apk/**'
      - '.github/workflows/python3-apk-template.yml'

permissions:
  contents: read

env:
  TEMPLATE_DIR: templates/python3-apk
  ANDROID_API: '36'
  NDK_API: '29'
  NDK_VERSION: '28.2.13676358'
  BUILD_TOOLS_VERSION: '36.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout build ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: templates/python3-apk/requirements-build.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APT build essentials
        run: |
          set -euo pipefail
          mapfile -t APT_DEPS < <(grep -Ev '^[[:space:]]*(#|$)' "$TEMPLATE_DIR/apt-build-dependencies.txt")
          test "${#APT_DEPS[@]}" -gt 0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${APT_DEPS[@]}"

      - name: Install host Python build essentials
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-build.txt
          python -m pip check
          python -c 'import Cython, build, packaging, setuptools, wheel, virtualenv; print("PY_BUILD_DEPS_GREEN")'
          p4a --version

      - name: Install Android API 36 and NDK r28c
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platform-tools' \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"
          test -x "$SDKROOT/platform-tools/adb"
          test -x "$SDKROOT/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          test -d "$SDKROOT/ndk/${NDK_VERSION}"

      - name: Static template sanity
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          python -m py_compile app/main.py sanity.py
          grep -q '^--arch arm64-v8a$' .p4a
          grep -q '^--android_api 36$' .p4a
          grep -q '^--ndk_api 29$' .p4a
          grep -q '^--bootstrap webview$' .p4a
          grep -q '^--requirements python3,flask$' .p4a
          grep -qx 'flask' requirements-app.txt
          ! grep -RIE '(OPENAI_API_KEY|HF_TOKEN|GOOGLE_APPLICATION_CREDENTIALS|PRIVATE KEY)' app .p4a requirements-*.txt || false

      - name: Cross-compile Python3 APK
        working-directory: ${{ env.TEMPLATE_DIR }}
        env:
          BUILD_MODE: debug
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROIDSDK="$SDKROOT"
          export ANDROID_SDK_ROOT="$SDKROOT"
          export ANDROID_HOME="$SDKROOT"
          export ANDROIDNDK="$SDKROOT/ndk/$NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROIDNDK"
          export ANDROIDAPI="$ANDROID_API"
          export NDKAPI="$NDK_API"
          test -d "$ANDROIDSDK"
          test -d "$ANDROIDNDK"
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Verify Android package identity
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDKROOT/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          APK='dist/samsung-sm-x400-python-debug.apk'
          "$AAPT" dump badging "$APK" | tee dist/badging.txt
          grep -q "package: name='art.eggiebagelface.samsungx400.python'" dist/badging.txt
          grep -q "native-code: 'arm64-v8a'" dist/badging.txt

      - name: Upload APK build-candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: samsung-sm-x400-python3-apk-${{ github.run_id }}
          path: |
            templates/python3-apk/dist/samsung-sm-x400-python-debug.apk
            templates/python3-apk/dist/sha256.txt
            templates/python3-apk/dist/badging.txt
            templates/python3-apk/.p4a
            templates/python3-apk/apt-build-dependencies.txt
            templates/python3-apk/requirements-build.txt
            templates/python3-apk/requirements-app.txt
            templates/python3-apk/README.md
          if-no-files-found: error
          retention-days: 14
