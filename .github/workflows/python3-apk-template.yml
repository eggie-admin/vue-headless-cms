name: python3-apk-template

on:
  workflow_dispatch:
  push:
    branches: [samsung-sm-x400-backend]
    paths:
      - 'templates/python3-apk/**'
      - '.github/workflows/python3-apk-template.yml'
  pull_request:
    branches: [samsung-sm-x400]
    paths:
      - 'templates/python3-apk/**'
      - '.github/workflows/python3-apk-template.yml'

permissions:
  contents: read

env:
  TEMPLATE_DIR: templates/python3-apk
  ANDROID_API: '36'
  NDK_API: '29'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build-essential Android/Python prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ant \
            autoconf \
            automake \
            autopoint \
            build-essential \
            ccache \
            cmake \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            patch \
            pkg-config \
            python3-dev \
            python3-venv \
            unzip \
            wget \
            zip

      - name: Install Android API 36 and NDK r28c
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platform-tools' \
            "platforms;android-${ANDROID_API}" \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"

      - name: Install pinned python-for-android
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-build.txt
          p4a --version

      - name: Static template sanity
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          python -m py_compile app/main.py sanity.py
          grep -q '^--arch arm64-v8a$' .p4a
          grep -q '^--android_api 36$' .p4a
          grep -q '^--ndk_api 29$' .p4a
          grep -q '^--bootstrap webview$' .p4a
          # Local `android` recipe override must declare Cython as a build
          # requirement so p4a's isolated wheel build can import it (see README).
          grep -q 'Cython' p4a-recipes/android/src/pyproject.toml
          python -m py_compile p4a-recipes/android/__init__.py p4a-recipes/android/src/setup.py
          ! grep -RIE '(OPENAI_API_KEY|HF_TOKEN|GOOGLE_APPLICATION_CREDENTIALS|PRIVATE KEY)' app .p4a || false

      - name: Cross-compile Python3 APK
        working-directory: ${{ env.TEMPLATE_DIR }}
        env:
          BUILD_MODE: debug
        run: |
          set -euo pipefail
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDNDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROIDAPI="$ANDROID_API"
          export NDKAPI="$NDK_API"
          test -d "$ANDROIDSDK"
          test -d "$ANDROIDNDK"
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Verify Android package identity
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APK='dist/samsung-sm-x400-python-debug.apk'
          "$AAPT" dump badging "$APK" | tee dist/badging.txt
          grep -q "package: name='art.eggiebagelface.samsungx400.python'" dist/badging.txt
          grep -q "native-code: 'arm64-v8a'" dist/badging.txt

      - name: Upload APK build-essential artifact
        uses: actions/upload-artifact@v4
        with:
          name: samsung-sm-x400-python3-apk-template
          path: |
            templates/python3-apk/dist/samsung-sm-x400-python-debug.apk
            templates/python3-apk/dist/sha256.txt
            templates/python3-apk/dist/badging.txt
            templates/python3-apk/.p4a
            templates/python3-apk/requirements-build.txt
          if-no-files-found: error
          retention-days: 14
