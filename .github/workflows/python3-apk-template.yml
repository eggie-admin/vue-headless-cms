name: python3-apk-template

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Optional git ref to build instead of the triggering ref
        required: false
        default: ''
  workflow_call:
    inputs:
      checkout_ref:
        description: Optional git ref to build instead of the caller ref
        required: false
        type: string
        default: ''
  push:
    branches:
      - samsung-sm-x400-backend
      - samsung-sm-x400-build-candidate
      - samsung-sm-s721u1-kai9000-fdroid-cathedral
      - ultima/final-apk-jquery-python3
    paths:
      - 'templates/python3-apk/**'
      - 'manifests/oss-vendors.lock.json'
      - 'scripts/vendor_sanity.py'
      - '.github/workflows/python3-apk-template.yml'
  pull_request:
    branches: [samsung-sm-x400]
    paths:
      - 'templates/python3-apk/**'
      - 'manifests/oss-vendors.lock.json'
      - 'scripts/vendor_sanity.py'
      - '.github/workflows/python3-apk-template.yml'

permissions:
  contents: read

env:
  TEMPLATE_DIR: templates/python3-apk
  ANDROID_API: '36'
  NDK_API: '29'
  NDK_VERSION: '28.2.13676358'
  BUILD_TOOLS_VERSION: '36.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout build ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: OSS vendor sanity
        run: python3 scripts/vendor_sanity.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: templates/python3-apk/requirements-build.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Vendor locked jQuery cockpit asset
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2
          npm ci --ignore-scripts --no-audit --no-fund
          npm run vendor:jquery
          test -s app/static/jquery.min.js
          grep -q 'jQuery v3.7.1' app/static/jquery.min.js
          grep -q 'KAI9000 ULTIMA' app/main.py
          grep -q '127.0.0.1:8797' app/main.py
          echo JQUERY_COCKPIT_GREEN

      - name: Install APT build essentials
        run: |
          set -euo pipefail
          mapfile -t APT_DEPS < <(grep -Ev '^[[:space:]]*(#|$)' "$TEMPLATE_DIR/apt-build-dependencies.txt")
          test "${#APT_DEPS[@]}" -gt 0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${APT_DEPS[@]}"

      - name: Install host Python build essentials
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-build.txt
          python -m pip check
          python -c 'import Cython, appdirs, build, colorama, jinja2, packaging, setuptools, sh, toml, wheel; print("PY_BUILD_DEPS_GREEN")'
          command -v meson
          command -v ninja
          p4a --version

      - name: Install Android API 36 and NDK r28c
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platform-tools' \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"
          test -x "$SDKROOT/platform-tools/adb"
          test -x "$SDKROOT/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          test -d "$SDKROOT/ndk/${NDK_VERSION}"

      - name: Static template sanity
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          python -m py_compile app/main.py sanity.py
          grep -q '^--arch arm64-v8a$' .p4a
          grep -q '^--android_api 36$' .p4a
          grep -q '^--ndk_api 29$' .p4a
          grep -q '^--bootstrap webview$' .p4a
          grep -q '^--requirements python3,flask$' .p4a
          grep -q '^--name KAI9000 Ultima$' .p4a
          grep -q '^--version 1.0.0$' .p4a
          grep -qx 'flask' requirements-app.txt
          test -s app/static/jquery.min.js
          test -s app/static/cockpit.js
          ! grep -RIE '(OPENAI_API_KEY|HF_TOKEN|GOOGLE_APPLICATION_CREDENTIALS|PRIVATE KEY)' app .p4a requirements-*.txt
          echo STATIC_ULTIMA_GREEN

      - name: Cross-compile Python3 APK
        working-directory: ${{ env.TEMPLATE_DIR }}
        env:
          BUILD_MODE: debug
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROIDSDK="$SDKROOT"
          export ANDROID_SDK_ROOT="$SDKROOT"
          export ANDROID_HOME="$SDKROOT"
          export ANDROIDNDK="$SDKROOT/ndk/$NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROIDNDK"
          export ANDROIDAPI="$ANDROID_API"
          export NDKAPI="$NDK_API"
          test -d "$ANDROIDSDK"
          test -d "$ANDROIDNDK"
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Verify Android package identity
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT="$SDKROOT/build-tools/${BUILD_TOOLS_VERSION}/aapt"
          APK='dist/samsung-sm-x400-python-debug.apk'
          "$AAPT" dump badging "$APK" | tee dist/badging.txt
          grep -q "package: name='art.eggiebagelface.samsungx400.python'" dist/badging.txt
          grep -q "application-label:'KAI9000 Ultima'" dist/badging.txt
          grep -q "native-code: 'arm64-v8a'" dist/badging.txt
          echo APK_IDENTITY_GREEN

      - name: Upload KAI9000 Ultima APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kai9000-ultima-python3-apk-${{ github.run_id }}
          path: |
            templates/python3-apk/dist/samsung-sm-x400-python-debug.apk
            templates/python3-apk/dist/sha256.txt
            templates/python3-apk/dist/badging.txt
            templates/python3-apk/.p4a
            templates/python3-apk/package.json
            templates/python3-apk/package-lock.json
            templates/python3-apk/apt-build-dependencies.txt
            templates/python3-apk/requirements-build.txt
            templates/python3-apk/requirements-app.txt
            templates/python3-apk/README.md
          if-no-files-found: error
          retention-days: 14
