Name: KAI 9000 Cathedral Dev
Summary: Local-first Godot AI cockpit for Samsung Android
Description: |-
  KAI 9000 is a local-first Android AI cockpit built around Godot 4 and a
  bundled Vue 3 WebView interface.

  The cockpit provides CHAT, AGENTS, GALLERY, SYSTEM and CMS surfaces. AI
  requests are converted into typed decisions before any bounded automation
  is offered. High-impact actions require explicit operator approval and
  arbitrary shell execution is not exposed to the model.

  The Samsung S24 FE lane is Knox-first and does not require root. Gallery
  access uses the Android system Photo Picker and only the selected item is
  copied into app-private cache. The WebView uses an app-owned HTTPS origin,
  blocks mixed content, rejects oversized bridge messages and routes external
  navigation to the system browser.

  Local inference uses an optional Ollama-compatible localhost antenna with
  Qwen 2.5 0.5B as the preferred small model. OpenAI is an optional cloud
  reasoning lane configured outside the APK. GitHub Copilot remains a
  developer/build assistant and is not an Android runtime authority.

  This metadata stages a private F-Droid repository build. It is not a claim
  of acceptance into the official F-Droid repository.
