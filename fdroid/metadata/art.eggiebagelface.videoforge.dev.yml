Name: Luhm OS
Summary: Local-first Android AI cockpit, working title KAI 9000
Description: |-
  Luhm OS is a local-first Android AI and media-control environment built around
  Godot 4, a bundled Vue 3 WebView interface, and a Python 3 control plane.

  KAI 9000 remains the project's working title and internal codename. Historical
  KAI9000 milestones, environment variables, and artifact names remain valid
  compatibility references during the branding migration.

  The rooted Samsung development lane uses a typed privileged broker. The APK
  does not expose arbitrary shell execution or a generic su relay. The WebView
  uses an app-owned HTTPS origin and typed bridge boundaries.

  This metadata stages a private F-Droid repository build. It is not a claim of
  acceptance into the official F-Droid repository.
