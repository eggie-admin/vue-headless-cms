Name: KAI 9000 Dev
Summary: Local-first Godot and Python control cockpit for Samsung development
Description: |-
  Development build of the KAI 9000 Android cockpit.

  This package is intended for private development distribution and Samsung
  smoke testing. It uses Godot as the fullscreen interactive shell and
  communicates with the local FastAPI control plane through typed contracts.

  The Vue CMS is bundled into the APK and displayed by the CathedralAndroid
  Godot Android v2 WebView plugin. CMS documents persist in the Termux Python
  edge through revisioned SQLite storage. Python remains outside the APK.

  This metadata is for a private F-Droid repository lane. It is not a claim of
  acceptance into the official F-Droid repository.
SourceCode: https://github.com/eggie-admin/vue-headless-cms
CurrentVersion: 0.7.0-dev
