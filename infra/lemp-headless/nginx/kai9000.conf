upstream kai_fastapi {
    server 127.0.0.1:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /srv/kai9000/www;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'nginx-green\n';
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_pass http://kai_fastapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    # Streaming/SSE lane. Keep buffering off so tokens are not held by Nginx.
    location /api/chat/stream {
        proxy_http_version 1.1;
        proxy_pass http://kai_fastapi/chat/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Intentionally no /ollama proxy.
    # Intentionally no generic PHP execution rule.
}
